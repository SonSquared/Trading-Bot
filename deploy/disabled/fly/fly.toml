# fly.toml app configuration file generated for trading-bot-sonsquared on 2026-09-01T10:34:15+07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'trading-bot-sonsquared'
primary_region = 'ord'

[build]
  dockerfile = 'Dockerfile'

[env]
  BOT_MODE = 'paper'
  HEALTH_PORT = '8080'
  TELEGRAM_ENABLED = 'true'

[[mounts]]
  source = 'trading_state'
  destination = '/app/data/results'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 10
    soft_limit = 5

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
