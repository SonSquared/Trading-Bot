# fly.toml - Fly.io deployment config for Trading Bot
# Docs: https://fly.io/docs/reference/configuration/

app = "trading-bot-sonsquared"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  BOT_MODE = "paper"
  TELEGRAM_ENABLED = "true"
  HEALTH_PORT = "8080"

# Secrets (set via fly secrets set, NOT here):
#   TELEGRAM_BOT_TOKEN
#   TELEGRAM_CHAT_ID

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 10
    soft_limit = 5

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

# Persistent volume for trading state
[[mounts]]
  source = "trading_state"
  destination = "/app/data/results"
