# AI Trading Bot configuration (Nate Herk plan adapted to Gemini's FREE tier)
#
# Usage:
#   python scripts/start_ai_bot.py once          # single wakeup now (paper)
#   python scripts/start_ai_bot.py run           # continuous 6x/day schedule
#   python scripts/start_ai_bot.py status        # show state summary
#
# Required environment (.env): GEMINI_API_KEY=... (free from
# https://aistudio.google.com/apikey — no credit card needed)
# Optional: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID

bot:
  # paper | live — live additionally requires explicit CLI --live confirmation
  mode: paper

  # Binance USDⓈ-M perpetual pairs the AI may trade. NOTHING outside this
  # list will ever be traded, even if the AI asks.
  pairs:
    - BTC/USDT:USDT
    - ETH/USDT:USDT

  timeframe: "1h"

  # Directory for shared continuity files (strategy/progress/journal/ledger)
  data_dir: data/ai_bot

  # Paper trading starting equity (USD) — the account's origin.
  #
  # THIS IS THE ONLY OWNER OF THIS NUMBER. The agent reads it directly and
  # raises if it is missing; there is no default to fall back to (a silent
  # fallback is how a $10,000 book ran for a $97 balance unnoticed).
  #
  # Used when a data_dir has no ledger yet. An EXISTING ledger keeps the origin
  # it was created with — history is never rewritten. When the two disagree,
  # the journal, the digest and the weekly report label the history as legacy
  # instead of mixing the two scales.
  paper_starting_equity: 97

  # Binance TESTNET rehearsal (recommended between paper and live):
  # true = hit testnet.binancefuture.com using BINANCE_TESTNET_API_KEY /
  # BINANCE_TESTNET_API_SECRET from .env. Get free testnet keys at
  # https://testnet.binancefuture.com — same order flow as live, fake money.
  sandbox: false

  # Local timezone offset from UTC in hours (e.g. -5 = EST, 1 = CET).
  # Schedule times below are interpreted in this zone.
  tz_offset_hours: 0

# AI engine settings
ai:
  # gemini-flash-latest runs on Google's FREE tier (free AI Studio key, no
  # credit card; 6 wakeups/day fit far inside the free rate limits). The
  # alias always tracks the newest flash model, so Google retiring pinned
  # versions never breaks the bot. Any OpenAI model also works (set
  # OPENAI_API_KEY instead).
  model: gemini-flash-latest
  temperature: 0.3
  max_tokens: 2000

# Hard risk rules — enforced in code; the AI cannot override them.
risk:
  max_risk_per_trade_pct: 2.0
  # Max notional per position, % of equity. The two rules that bound a single
  # position are:
  #   risk cap      max_risk_per_trade_pct / stop_loss_max_pct * 100 = 2/5*100 = 40
  #   exposure cap  max_portfolio_heat_pct                           = 30
  # so the smaller, 30, is what a position can actually reach — and 30 is what
  # is set here. Quoting 40 would name a size no position can hold.
  #
  # The old flat 10% was an arbitrary third cap, unrelated to either rule: at
  # $97 it allowed only $9.70, below Binance's $20 (ETH) / $50 (BTC) minimum
  # order, so NO order the bot could size was legal. At 30%, ETH is placeable
  # ($20.00-$29.10) while BTC is still refused with its arithmetic.
  #
  # Per-trade loss is unchanged in kind and still under the 2% cap: at the
  # widest stop the loss is 30% * 5% = 1.5% of equity. The 2% cap is the outer
  # bound and is enforced directly (not implied by the size cap), so no future
  # edit to either number can raise it silently.
  max_position_size_pct: 30.0
  # Total notional across all positions, % of equity (the same definition the
  # main bot enforces). This is the cap that binds at a small account size: a
  # single position cannot exceed it, so it also bounds the per-trade ceiling.
  max_portfolio_heat_pct: 30.0
  max_open_positions: 3
  max_drawdown_pct: 10.0          # trading halts (closes only) at this level
  stop_loss_max_pct: 5.0
  min_risk_reward_ratio: 1.5
  min_confidence_to_trade: 60

# Daily wakeup schedule (times in local offset zone above)
schedule:
  - name: asia_session_open
    hour: 0
    minute: 0
    description: "Pre-market research, check news"
  - name: asia_london_overlap
    hour: 6
    minute: 0
    description: "First trade check, scan for setups"
  - name: london_open
    hour: 8
    minute: 0
    description: "Mid-morning review, manage positions"
  - name: us_open
    hour: 14
    minute: 0
    description: "US session start, new opportunities"
  - name: us_midday
    hour: 20
    minute: 0
    description: "Position management, adjust stops"
  - name: daily_close
    hour: 23
    minute: 0
    description: "End-of-day review, record results"

# Telegram notifications (report-only; never places orders). Enabled here so
# cloud runs send alerts as soon as AI_TELEGRAM_BOT_TOKEN / AI_TELEGRAM_CHAT_ID
# are set as repo secrets. Without them the notifier fails safe (sends nothing).
telegram:
  enabled: true
  # Token/chat id come from AI_TELEGRAM_BOT_TOKEN / AI_TELEGRAM_CHAT_ID
  # (or the unprefixed TELEGRAM_* names) env vars
