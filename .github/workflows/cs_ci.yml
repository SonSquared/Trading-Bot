# crypto_system CI: full verification of the audited platform.
# Independent of the legacy trading bot's workflows by design (cs_ prefix).
name: cs-ci

on:
  push:
    branches: [main]
    paths:
      - "src/crypto_system/**"
      - "scripts/improve.py"
      - "tests/test_cs_*.py"
      - ".github/workflows/cs_*.yml"
  pull_request:
    paths:
      - "src/crypto_system/**"
      - "scripts/improve.py"
      - "tests/test_cs_*.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cs-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # requirements.txt includes the legacy bot's deps because the shared
          # tests/conftest.py imports scripts.paper_trader at collection time.
          python -m pip install -q -r requirements.txt pytest ruff mypy

      - name: Lint (ruff)
        run: python -m ruff check src/crypto_system scripts/improve.py scripts/cs_smoke_testnet.py tests/test_cs_*.py

      - name: Type check (mypy)
        run: python -m mypy src/crypto_system --ignore-missing-imports

      - name: Tests (cs suite)
        run: python -m pytest tests/test_cs_config.py tests/test_cs_ledger.py tests/test_cs_data.py tests/test_cs_execution.py tests/test_cs_risk.py tests/test_cs_research.py tests/test_cs_improve.py tests/test_cs_live.py tests/test_cs_binance_transport.py tests/test_cs_workflows.py -q

      - name: Deterministic quick run (no network, no promotion)
        run: python scripts/improve.py --quick --report-only
