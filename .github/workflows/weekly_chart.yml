name: Weekly Chart Report
on:
  schedule:
    # Run every Sunday at 12:00 UTC
    - cron: '0 12 * * 0'
  workflow_dispatch:

permissions:
  contents: read  # Reads state from the bot-state branch

jobs:
  weekly-chart:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore paper trading state
        # State lives on the bot-state branch (same source the bot itself
        # restores from) — the Actions cache is no longer the carrier.
        run: |
          mkdir -p data/results
          if git ls-remote --exit-code --heads origin bot-state >/dev/null 2>&1; then
            git fetch --depth=1 origin bot-state
            git checkout FETCH_HEAD -- data/results/ \
              && echo "State restored from bot-state branch" \
              || echo "WARNING: bot-state branch has no data/results yet"
          else
            echo "No bot-state branch yet — charts will show a fresh account"
          fi

      - name: Generate and send weekly charts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ENABLED: 'true'
        run: python -u scripts/weekly_chart.py
