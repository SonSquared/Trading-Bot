name: Trading Bot Runner
on:
  schedule:
    # Run every hour for faster command responses
    - cron: '0 * * * *'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write  # For pushing trade logs

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run paper trading bot
        env:
          BOT_MODE: paper
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ENABLED: 'true'
        run: python -u scripts/paper_trader.py

      - name: Upload trade log & state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-results-${{ github.run_number }}
          path: |
            data/results/paper_trades.jsonl
            data/results/paper_state.json
            data/results/paper_summary.json
          retention-days: 90

      - name: Restore state from previous run
        uses: actions/cache@v4
        with:
          path: data/results/paper_state.json
          key: paper-state-${{ github.run_number }}
          restore-keys: paper-state-
