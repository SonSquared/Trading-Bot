name: Trading Bot Runner
on:
  schedule:
    # Run every 15 minutes for faster command responses
    - cron: '*/15 * * * *'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write  # For pushing trade logs

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create results directory
        run: mkdir -p data/results

      - name: Restore state from previous run
        uses: actions/cache@v4
        with:
          path: data/results/paper_state.json
          key: paper-state-v2-${{ github.run_number }}
          restore-keys: paper-state-v2-
      # Clear stale state from previous code versions (e.g. $10,000 accounts)
      - name: Validate state file
        run: |
          python -c "
          import json, sys
          try:
              with open('data/results/paper_state.json') as f:
                  state = json.load(f)
              cash = state.get('cash', 0)
              if cash > 500:  # A $97 account should never have >$500 cash
                  print(f'Clearing stale state: cash={cash}')
                  import os
                  os.remove('data/results/paper_state.json')
          except Exception:
              pass
          "

      - name: Run paper trading bot
        env:
          BOT_MODE: paper
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ENABLED: 'true'
        run: python -u scripts/paper_trader.py

      - name: Monitor open positions
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -u scripts/position_tracker.py

      - name: Upload trade log & state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-results-${{ github.run_number }}
          path: |
            data/results/paper_trades.jsonl
            data/results/paper_state.json
            data/results/paper_summary.json
            data/results/run_history.jsonl
          retention-days: 90
