name: AI Bot Heartbeat Guard
# Independent supervisor for the poller heartbeat.
#
# The pulse used to depend on each generation reaching its OWN last step: the
# relaunch is step 10 of ai_poller.yml, so a generation that is cancelled,
# killed or whose dispatch call fails ends the chain, and the four "backup"
# crons in that file only deliver ~25% of their scheduled firings (13 of the
# last 100 poller runs were `schedule`). Recovery therefore depended on the
# thing that had just failed.
#
# This workflow breaks that dependency. It is triggered independently, touches
# nothing in the trading path, and does exactly one thing: guarantee that a
# live poller generation exists (scripts/ai_heartbeat_guard.py).
#
# It runs BEFORE any pip/checkout cost beyond a shallow clone — the guard is
# stdlib-only on purpose, because a recovery path that needs a dependency
# install can fail for the wrong reason.
on:
  push:
    branches: [main]
    # Self-check: a change to the guard (or to this file) proves it still runs
    # against the real pulse. Deliberately narrow so ordinary pushes do not
    # add guard runs.
    paths:
      - "scripts/ai_heartbeat_guard.py"
      - "tests/test_heartbeat_guard.py"
      - ".github/workflows/ai_heartbeat_guard.yml"
  schedule:
    # Every 10 minutes. Kept as six explicit lines because GitHub thins this
    # repo's crons badly (see the numbers above) — six chances beat one, and
    # each firing is a cheap API read when everything is healthy.
    # Deliberately off the poller's :07/:22/:37/:52 and the bot's :02/:12/:22/…
    - cron: '4 * * * *'
    - cron: '14 * * * *'
    - cron: '24 * * * *'
    - cron: '34 * * * *'
    - cron: '44 * * * *'
    - cron: '54 * * * *'
  workflow_dispatch:
    # Manual run. The inputs exist so the RECOVERY PATH can be rehearsed for
    # real instead of assumed (see docs/AI_BOT_HEARTBEAT.md §5):
    #   stale_minutes=1  -> the live generation is classified as hung, so a
    #                       replacement is dispatched and the handoff is
    #                       observed for real
    #   dispatch=true    -> force a repair
    #   dry_run=true     -> decide and report, change nothing
    # Leaving them blank is the normal production behaviour.
    inputs:
      stale_minutes:
        description: "Rehearsal: override STALE_MINUTES (blank = 40)"
        required: false
        default: ""
      dispatch:
        description: "Rehearsal: force a repair"
        type: boolean
        default: false
      dry_run:
        description: "Decide and report only"
        type: boolean
        default: false
  workflow_run:
    # Fast path: a generation COMPLETED but its relaunch step failed. That is
    # the failure the old design could not survive, and it is now detected
    # within seconds instead of at the next cron.
    #
    # One-directional on purpose: the poller does NOT list this workflow, so
    # there is no mutual kick to spin. A dispatch here makes the next check
    # see a young active generation, which is what stops any hot loop.
    workflows:
      - "AI Bot Telegram Poller"
    types: [completed]

permissions:
  contents: read  # checkout, to read the guard script
  actions: write  # dispatching the replacement poller generation

concurrency:
  group: ai-heartbeat-guard
  cancel-in-progress: true  # the newest check is the only one that matters

jobs:
  guard:
    runs-on: ubuntu-latest
    # Long enough for a grace re-check (the run sleeps out the remaining
    # GRACE_MINUTES and looks again, so a killed generation is repaired by the
    # completion event that woke the guard rather than by a later cron), and
    # still cheap: the common healthy path is a ~20s API read.
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - name: Ensure a live poller generation exists
        # ubuntu-latest ships python3; nothing to install. Values reach the
        # script through env, never string-interpolated into the command.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_TELEGRAM_BOT_TOKEN: ${{ secrets.AI_TELEGRAM_BOT_TOKEN }}
          AI_TELEGRAM_CHAT_ID: ${{ secrets.AI_TELEGRAM_CHAT_ID }}
          # Thresholds default to 40/3 min; overridable for a rehearsed
          # recovery test (see docs/AI_BOT_HEARTBEAT.md).
          AI_HEARTBEAT_STALE_MINUTES: ${{ inputs.stale_minutes }}
          HEARTBEAT_FORCE_DISPATCH: ${{ inputs.dispatch }}
          HEARTBEAT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=""
          if [ "$HEARTBEAT_FORCE_DISPATCH" = "true" ]; then ARGS="$ARGS --dispatch"; fi
          if [ "$HEARTBEAT_DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python3 -u scripts/ai_heartbeat_guard.py $ARGS
