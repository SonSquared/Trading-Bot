name: Bot Health Check
on:
  schedule:
    # Independent sentinel — runs OUTSIDE the bot workflow, so it can
    # report exactly the failure the bot's own watchdog cannot: both cron
    # slots in a window dying (the bot then never runs, so its in-process
    # watchdog never executes either). Hourly checks (~0.6 min each) keep
    # detection latency ≈1h after the second slot of a window dies.
    # NOTE: scheduled workflows on the free tier are DISABLED after 60 days
    # of repo inactivity; keep commits flowing.
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  actions: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Check last bot run
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const now = new Date();
            // Threshold: 3h. Healthy max gap between successful bot runs
            // is ~2h (redundant :23/:47 slots per even hour, plus runner
            // queue delay). A gap past 3h means BOTH slots of a window
            // died — exactly the silent scheduler gap this sentinel
            // exists to catch (e.g. 2026-09-08 22:22+22:46 both dropped,
            // leaving a 3.1h gap that nothing reported).
            const HOURS = 3;
            const cutoff = new Date(now.getTime() - HOURS * 60 * 60 * 1000);

            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'bot.yml',
              per_page: 15,
            });

            const allRuns = runs.data.workflow_runs.filter(r =>
              new Date(r.created_at) >= new Date(now.getTime() - 48 * 60 * 60 * 1000));

            const successful = allRuns.filter(r => r.conclusion === 'success');
            const failed = allRuns.filter(r => r.conclusion === 'failure');
            const recentSuccess = successful.find(r => new Date(r.created_at) >= cutoff);
            const recentFailed = failed.filter(r => new Date(r.created_at) >= cutoff);

            const token = '${{ secrets.TELEGRAM_BOT_TOKEN }}';
            const chatId = '${{ secrets.TELEGRAM_CHAT_ID }}';

            async function alert(title, body) {
              if (!token || !chatId) {
                console.log('No Telegram secrets — logging only:', title);
                return;
              }
              await fetch('https://api.telegram.org/bot' + token + '/sendMessage', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: chatId, text: title + '\n\n' + body }),
              });
              console.log('Telegram alert sent:', title);
            }

            if (recentSuccess) {
              const gap = ((now - new Date(recentSuccess.created_at)) / 3600000).toFixed(1);
              console.log('Bot healthy. Last success ' + gap + 'h ago: ' + recentSuccess.created_at);
              if (recentFailed.length > 0) {
                console.log('WARNING: ' + recentFailed.length + ' failed bot run(s) inside the healthy window: ' +
                  recentFailed.map(r => r.created_at).join(', '));
              }
            } else {
              const lastSuccess = successful.length > 0 ? successful[0] : null;
              const gapH = lastSuccess
                ? ((now - new Date(lastSuccess.created_at)) / 3600000).toFixed(1)
                : null;

              let msg = 'HEALTH ALERT: No successful bot run in ' + HOURS + 'h\n\n';
              // (3h threshold ≈ one fully-dropped cron window)
              if (recentFailed.length > 0) {
                msg += 'Bot RAN but FAILED ' + recentFailed.length + 'x:\n';
                msg += recentFailed.slice(0, 3).map(r =>
                  '- ' + r.created_at + ' (' + r.conclusion + ')').join('\n');
                msg += '\nLogs: https://github.com/' + context.repo.owner + '/' + context.repo.repo +
                  '/actions/runs/' + recentFailed[0].id + '\n\n';
              } else {
                msg += 'Bot did NOT run at all in the window — both cron slots of a ' +
                  'window likely dropped (GitHub scheduler throttling).\n\n';
              }
              msg += lastSuccess
                ? 'Last success was ' + gapH + 'h ago: ' + lastSuccess.created_at
                : 'No successful bot run found in the last 48h.';
              msg += '\nManual fix: re-run the bot workflow from the Actions tab.';

              await alert('HEALTH ALERT', msg);
              core.setFailed('No successful bot run in the last ' + HOURS + 'h');
            }
