name: AI Bot Health Check
on:
  schedule:
    # Independent sentinel for the AI bot — mirrors health_check.yml (the
    # main bot's). It exists to report the failure the bot cannot report
    # itself: a silently dead scheduler (cron slots dropped, repo disabled
    # after 60 days of inactivity, runner queue death).
    #
    # Threshold is 8h because the AI schedule's largest NORMAL gap is 6h
    # (00->06, 08->14, 14->20 UTC). Do not lower it below 7h or it will
    # page during every quiet overnight stretch.
    - cron: '40 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  # Kicking the heartbeat guard when this patrol alarms (see below). The guard
  # owns the pulse's thresholds and its repair; this workflow only reports the
  # pulse's state and gives the guardian one more chance to act.
  actions: write

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Check last successful AI wakeup
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const now = new Date();
            const HOURS = 8;
            const cutoff = new Date(now.getTime() - HOURS * 60 * 60 * 1000);

            // Primary signal: the journal on the ai-bot-state branch. We
            // check the last SUCCESS entry (not workflow run success) because
            // a gate-skipped redundant firing also concludes "success" at the
            // workflow level while the actual wakeup may be failing.
            let lastSuccess = null;
            let journalNote = '';
            try {
              const resp = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: 'data/ai_bot/journal.jsonl',
                ref: 'ai-bot-state',
              });
              const text = Buffer.from(resp.data.content, 'base64').toString('utf8');
              const lines = text.trim().split('\n').filter(l => l.trim());
              for (let i = lines.length - 1; i >= 0; i--) {
                try {
                  const e = JSON.parse(lines[i]);
                  if (e.status === 'success' && e.timestamp) {
                    lastSuccess = new Date(e.timestamp);
                    break;
                  }
                } catch (_) { /* skip corrupt line */ }
              }
              journalNote = 'journal has ' + lines.length + ' entries';
            } catch (err) {
              journalNote = 'journal unreadable (' + err.status + ')';
            }

            // Fallback signal: workflow runs (for the very first days before
            // the ai-bot-state branch has a journal).
            if (!lastSuccess) {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'ai_bot.yml',
                per_page: 30,
              });
              for (const r of runs.data.workflow_runs) {
                if (r.conclusion === 'success' && r.event !== 'push') {
                  lastSuccess = new Date(r.created_at);
                  break;
                }
              }
              journalNote += ' — fell back to workflow runs';
            }

            // AI_ prefix so the main bot's TELEGRAM_* secrets stay untouched.
            const token = '${{ secrets.AI_TELEGRAM_BOT_TOKEN }}';
            const chatId = '${{ secrets.AI_TELEGRAM_CHAT_ID }}';

            async function alert(title, body) {
              if (!token || !chatId) {
                console.log('No Telegram secrets — logging only:', title);
                return;
              }
              await fetch('https://api.telegram.org/bot' + token + '/sendMessage', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: chatId, text: title + '\n\n' + body }),
              });
              console.log('Telegram alert sent:', title);
            }

            if (lastSuccess && lastSuccess >= cutoff) {
              const gap = ((now - lastSuccess) / 3600000).toFixed(1);
              console.log('AI bot healthy. Last successful wakeup ' + gap + 'h ago. (' + journalNote + ')');
              return;
            }

            let msg;
            if (lastSuccess) {
              const gapH = ((now - lastSuccess) / 3600000).toFixed(1);
              msg = 'No successful AI wakeup in ' + HOURS + 'h.\n\n' +
                'Last success was ' + gapH + 'h ago: ' + lastSuccess.toISOString() +
                '\n(' + journalNote + ')\n\n' +
                'Likely causes: GitHub dropped cron slots, scheduled workflows ' +
                'auto-disabled after 60 days of repo inactivity, or every wakeup failing.\n' +
                'Fix: Actions tab -> AI Trading Bot -> Run workflow.';
            } else {
              msg = 'No successful AI wakeup EVER recorded.\n\n' +
                '(' + journalNote + ')\n\n' +
                'If this bot was just deployed: add the GEMINI_API_KEY (free) or OPENAI_API_KEY secret and ' +
                'trigger AI Trading Bot -> Run workflow once manually.';
            }

            // WHY THIS PATROL READS THE POLLER AT ALL: it used to look only at
            // the journal, so a dead or live-but-hung poller generation was
            // invisible here — this alert could not tell you whether the pulse
            // was the cause. The FACTS go in the alert; the POLICY (when a
            // generation counts as hung or dead, and what to do about it)
            // lives in one place, scripts/ai_heartbeat_guard.py.
            let pulse = 'unknown';
            let pulseHung = false;
            try {
              const pr = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner, repo: context.repo.repo,
                workflow_id: 'ai_poller.yml', per_page: 1,
              });
              const r = pr.data.workflow_runs[0];
              if (r) {
                const ageMin = (Date.now() - new Date(r.created_at)) / 60000;
                pulse = '#' + r.run_number + ' ' + r.status +
                  (r.conclusion ? '/' + r.conclusion : '') +
                  ', started ' + ageMin.toFixed(0) + ' min ago';
                // A generation still running long after the poller job's own
                // timeout-minutes (30) cannot be healthy: GitHub kills the job
                // at that point. The 30 is that job's declared timeout — a fact
                // of ai_poller.yml — NOT a policy threshold; the guard owns
                // those (and repairs this case).
                if (r.status === 'in_progress' && ageMin > 30) {
                  pulseHung = true;
                  pulse += ' — HUNG: in_progress past the poller job timeout, not slow';
                } else if (['queued', 'pending', 'requested'].includes(r.status)) {
                  pulse += ' — waiting for a runner';
                }
              } else {
                pulse = 'no poller generation has ever run';
              }
              console.log('Pulse: ' + pulse);
            } catch (e) {
              pulse = 'unreadable (' + e.status + ')';
            }
            // Belt and braces: let the guardian decide and repair.
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner, repo: context.repo.repo,
                workflow_id: 'ai_heartbeat_guard.yml', ref: 'main',
              });
              console.log('Kicked the heartbeat guard.');
            } catch (e) {
              console.log('Guard kick failed: ' + e.message);
            }

            await alert(
              pulseHung ? 'AI BOT HEALTH ALERT — PULSE HUNG' : 'AI BOT HEALTH ALERT',
              msg + '\n\nPulse: ' + pulse +
              (pulseHung
                ? '\n\nThe heartbeat guard replaces a hung generation on its own; ' +
                  'a Telegram \u201cHEARTBEAT RECOVERED\u201d follows when it does.'
                : '')
            );

            // SELF-HEAL WINDOW: the AI Trading Bot chain (workflow_run) is
            // kicked by this patrol's own completion path and by the alert
            // going out. Give a recovery wakeup a few minutes to land; if
            // it journaled a success, the incident is already over — go
            // green instead of leaving a red run on the board all day
            // (a red patrol every hour is exactly the cry-wolf pattern
            // that trains the user to ignore real alerts).
            const RECHECK_MINUTES = 6;
            console.log('Waiting ' + RECHECK_MINUTES + ' min for the self-healing chain to recover...');
            await new Promise(r => setTimeout(r, RECHECK_MINUTES * 60 * 1000));
            try {
              const resp2 = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: 'data/ai_bot/journal.jsonl',
                ref: 'ai-bot-state',
              });
              const text2 = Buffer.from(resp2.data.content, 'base64').toString('utf8');
              const lines2 = text2.trim().split('\n').filter(l => l.trim());
              const freshCutoff = new Date(Date.now() - (RECHECK_MINUTES + 4) * 60 * 1000);
              for (let i = lines2.length - 1; i >= 0; i--) {
                try {
                  const e = JSON.parse(lines2[i]);
                  if (e.status === 'success' && e.timestamp &&
                      new Date(e.timestamp) >= freshCutoff) {
                    console.log('RECOVERED: successful wakeup journaled at ' + e.timestamp +
                      ' during the wait window — incident resolved, patrol goes green.');
                    return;
                  }
                } catch (_) { /* skip corrupt line */ }
              }
            } catch (err) { /* still unrecovered */ }

            core.setFailed('No successful AI wakeup in the last ' + HOURS + 'h');
