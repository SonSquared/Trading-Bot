name: AI Bot Health Check
on:
  schedule:
    # Independent sentinel for the AI bot — mirrors health_check.yml (the
    # main bot's). It exists to report the failure the bot cannot report
    # itself: a silently dead scheduler (cron slots dropped, repo disabled
    # after 60 days of inactivity, runner queue death).
    #
    # Threshold is 8h because the AI schedule's largest NORMAL gap is 6h
    # (00->06, 08->14, 14->20 UTC). Do not lower it below 7h or it will
    # page during every quiet overnight stretch.
    - cron: '40 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Check last successful AI wakeup
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const now = new Date();
            const HOURS = 8;
            const cutoff = new Date(now.getTime() - HOURS * 60 * 60 * 1000);

            // Primary signal: the journal on the ai-bot-state branch. We
            // check the last SUCCESS entry (not workflow run success) because
            // a gate-skipped redundant firing also concludes "success" at the
            // workflow level while the actual wakeup may be failing.
            let lastSuccess = null;
            let journalNote = '';
            try {
              const resp = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: 'data/ai_bot/journal.jsonl',
                ref: 'ai-bot-state',
              });
              const text = Buffer.from(resp.data.content, 'base64').toString('utf8');
              const lines = text.trim().split('\n').filter(l => l.trim());
              for (let i = lines.length - 1; i >= 0; i--) {
                try {
                  const e = JSON.parse(lines[i]);
                  if (e.status === 'success' && e.timestamp) {
                    lastSuccess = new Date(e.timestamp);
                    break;
                  }
                } catch (_) { /* skip corrupt line */ }
              }
              journalNote = 'journal has ' + lines.length + ' entries';
            } catch (err) {
              journalNote = 'journal unreadable (' + err.status + ')';
            }

            // Fallback signal: workflow runs (for the very first days before
            // the ai-bot-state branch has a journal).
            if (!lastSuccess) {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'ai_bot.yml',
                per_page: 30,
              });
              for (const r of runs.data.workflow_runs) {
                if (r.conclusion === 'success' && r.event !== 'push') {
                  lastSuccess = new Date(r.created_at);
                  break;
                }
              }
              journalNote += ' — fell back to workflow runs';
            }

            const token = '${{ secrets.TELEGRAM_BOT_TOKEN }}';
            const chatId = '${{ secrets.TELEGRAM_CHAT_ID }}';

            async function alert(title, body) {
              if (!token || !chatId) {
                console.log('No Telegram secrets — logging only:', title);
                return;
              }
              await fetch('https://api.telegram.org/bot' + token + '/sendMessage', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: chatId, text: title + '\n\n' + body }),
              });
              console.log('Telegram alert sent:', title);
            }

            if (lastSuccess && lastSuccess >= cutoff) {
              const gap = ((now - lastSuccess) / 3600000).toFixed(1);
              console.log('AI bot healthy. Last successful wakeup ' + gap + 'h ago. (' + journalNote + ')');
              return;
            }

            let msg;
            if (lastSuccess) {
              const gapH = ((now - lastSuccess) / 3600000).toFixed(1);
              msg = 'No successful AI wakeup in ' + HOURS + 'h.\n\n' +
                'Last success was ' + gapH + 'h ago: ' + lastSuccess.toISOString() +
                '\n(' + journalNote + ')\n\n' +
                'Likely causes: GitHub dropped cron slots, scheduled workflows ' +
                'auto-disabled after 60 days of repo inactivity, or every wakeup failing.\n' +
                'Fix: Actions tab -> AI Trading Bot -> Run workflow.';
            } else {
              msg = 'No successful AI wakeup EVER recorded.\n\n' +
                '(' + journalNote + ')\n\n' +
                'If this bot was just deployed: add the OPENAI_API_KEY secret and ' +
                'trigger AI Trading Bot -> Run workflow once manually.';
            }

            await alert('AI BOT HEALTH ALERT', msg);
            core.setFailed('No successful AI wakeup in the last ' + HOURS + 'h');
