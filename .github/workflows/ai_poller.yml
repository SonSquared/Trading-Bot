name: AI Bot Telegram Poller
# Always-on command responder: /status etc. answered within seconds, not
# at the next wakeup. Continuity does NOT depend on GitHub's cron
# scheduler (which silently dropped this workflow's slots for 70+
# minutes on 2026-09-13): each generation RELAUNCHES ITSELF on
# completion via workflow_run, and the trading wakeup/digest completions
# kick the chain too. The crons stay only as a harmless backup.
on:
  schedule:
    # Backup only — four explicit lines, :07/:22/:37/:52, off the trading
    # crons (:02/:32). If these never fire, the chain below sustains it.
    - cron: '7 * * * *'
    - cron: '22 * * * *'
    - cron: '37 * * * *'
    - cron: '52 * * * *'
  workflow_dispatch:  # manual start from the Actions tab
  workflow_run:
    # Trading wakeup + digest completions also kick the chain, so it
    # self-heals even after every generation has died (e.g. quota,
    # manual cancel).
    # NOTE: this workflow deliberately does NOT list itself here. GitHub
    # ignores self-referencing workflow_run triggers entirely (proven:
    # run #2 never fired after run #1), so self-chaining silently did
    # nothing. Continuity comes from the four backup crons above plus
    # the AI Trading Bot / digest completions below.
    workflows:
      - "AI Trading Bot"
      - "AI Bot Daily Digest"
      - "AI Bot Health Check"
    types: [completed]

permissions:
  contents: write  # the offset persist pushes to the ai-bot-state branch

# The KEY line: a new generation CANCELS the previous one and starts
# fresh (checkout, poller, restore) — this is what makes 15-min crons
# yield continuous, overlap-free coverage.
concurrency:
  group: ai-telegram-poller
  cancel-in-progress: true

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Record start time (for the anti-tight-loop pad)
        run: echo "POLL_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - name: Restore AI bot state from ai-bot-state branch
        # Read-only restore of ledger/journal/offset; the poller never
        # writes trading state. Its offset advance is confirmed
        # server-side at Telegram, so persisting the file back is a
        # nice-to-have, not a correctness requirement.
        run: |
          mkdir -p data/ai_bot
          if git ls-remote --exit-code --heads origin ai-bot-state >/dev/null 2>&1; then
            git fetch --depth=1 origin ai-bot-state
            git checkout FETCH_HEAD -- data/ai_bot/ \
              && echo "State restored from ai-bot-state branch" \
              || echo "WARNING: ai-bot-state branch has no data/ai_bot yet"
          else
            echo "No ai-bot-state branch yet — /status will show a fresh account"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        # requirements only — never the dev tools; this job runs ~2,880x/month
        run: pip install -r requirements.txt

      - name: Poll Telegram and answer commands
        env:
          AI_TELEGRAM_BOT_TOKEN: ${{ secrets.AI_TELEGRAM_BOT_TOKEN }}
          AI_TELEGRAM_CHAT_ID: ${{ secrets.AI_TELEGRAM_CHAT_ID }}
        # The chain relaunches this workflow on every completion, so a
        # fast exit (Telegram 409 yield, blip) must be padded to ~5 min
        # minimum — otherwise completions would chain into a tight loop.
        run: |
          start=$(date +%s)
          python -u scripts/ai_poller.py --max-minutes 20
          rc=$?
          elapsed=$(( $(date +%s) - start ))
          if [ "$elapsed" -lt 300 ]; then
            pad=$(( 300 - elapsed ))
            echo "Short poll generation (${elapsed}s) — padding ${pad}s " \
                 "to keep the relaunch chain from tight-looping"
            sleep "$pad"
          fi
          exit $rc

      - name: Anti-tight-loop pad (every outcome, even failed setup)
        # The chain relaunches on EVERY completion. A run that dies early
        # (checkout/pip failure) would otherwise relaunch within seconds
        # forever; this guarantees >=5 minutes between generations no
        # matter where the run failed.
        if: always()
        run: |
          elapsed=$(( $(date +%s) - POLL_START ))
          if [ "$elapsed" -lt 300 ]; then
            pad=$(( 300 - elapsed ))
            echo "Generation lasted ${elapsed}s — padding ${pad}s"
            sleep "$pad"
          fi

      - name: Persist poller offset (best-effort)
        if: always()
        env:
          STATE_BRANCH: ai-bot-state
        run: |
          set -e
          if [ ! -f data/ai_bot/telegram_offset.txt ]; then
            echo "No offset file produced — nothing to persist"
            exit 0
          fi
          rm -rf /tmp/aibotstate
          if git ls-remote --exit-code --heads origin "$STATE_BRANCH" >/dev/null 2>&1; then
            git fetch --depth=1 origin "$STATE_BRANCH"
            git worktree add /tmp/aibotstate "origin/$STATE_BRANCH"
          else
            git worktree add --orphan /tmp/aibotstate
          fi
          mkdir -p /tmp/aibotstate/data/ai_bot
          cp data/ai_bot/telegram_offset.txt /tmp/aibotstate/data/ai_bot/
          cd /tmp/aibotstate
          git add data/ai_bot/telegram_offset.txt
          if git diff --cached --quiet; then
            echo "Offset unchanged — nothing to persist"
            exit 0
          fi
          git -c user.name="ai-bot-state-persister" \
              -c user.email="actions@users.noreply.github.com" \
              commit -m "poller offset: ${{ github.run_number }}"
          git push origin "HEAD:$STATE_BRANCH"
          echo "Offset persisted"
