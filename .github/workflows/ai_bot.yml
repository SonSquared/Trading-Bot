name: AI Trading Bot
on:
  push:
    branches: [main]
    paths:
      - "trading_system/bot/ai_*.py"
      - "trading_system/bot/scheduler.py"
      - "trading_system/bot/exchange.py"
      - "scripts/start_ai_bot.py"
      - "scripts/ai_bot_gate.py"
      - "scripts/ai_heartbeat_guard.py"
      - "tests/test_ai_agent.py"
      - "tests/test_heartbeat_guard.py"
      - ".github/workflows/ai_bot.yml"
      - ".github/workflows/ai_heartbeat_guard.yml"
  # 6 wakeups/day (00/06/08/14/20/23 UTC). scripts/ai_bot_gate.py is
  # SLOT-BASED: a firing whose slot is already served exits immediately
  # without running a wakeup, so redundant triggers (and the ~20-min
  # workflow_run mesh below) cost ~15s instead of extra trade decisions.
  #
  # Re-timed 2026-09-22 after the 08:00 slot ran +108/+126/+160 min late (or
  # not at all) for four days: GitHub delivered only ~5 of 12 scheduled
  # firings/day, so the old :02/:32 lines alone could not keep the schedule.
  # The gate now relays over a 30-min window (wider than the ~5-20 min
  # heartbeat), which makes the PRE-SLOT lines below the punctuality
  # mechanism: a firing at 07:32/07:42/07:52 sleeps to 08:00 and fires it
  # exactly on time. Slot-hour lines are the intended firing + catch-up.
  schedule:
    # Slot hours — first firing serves the slot, later ones are catch-ups.
    - cron: '2,12,22,32,42,52 0,6,8,14,20,23 * * *'
    # Pre-slot hours — land inside the 30-min relay window of the next slot
    # (:32/:42/:52 are 28/18/8 min before it). 23:xx is already covered by
    # the line above, which is what makes the 00:00 slot punctual.
    - cron: '32,42,52 5,7,13,19,22 * * *'
  workflow_dispatch:  # manual trigger from the Actions tab
  workflow_run:
    # SELF-HEALING CHAIN: GitHub's cron silently drops slots (proven
    # 2026-09-13: the 06/08 UTC wakeups never fired; the "hourly" patrol
    # itself only runs ~6x/day). Other AI-suite workflows' completions kick
    # the next wakeup, turning a dropped slot into a delayed one. GitHub
    # ignores SELF-referencing workflow_run (proven on the poller), so the
    # kickers are OTHER suite members. The Telegram poller is the heartbeat:
    # each ~20-min generation ends by kicking a wakeup check, which is what
    # keeps the 6 slots firing despite thinned cron. As of 2026-09-22 that
    # heartbeat no longer depends on cron either — the poller relaunches
    # itself via workflow_dispatch (see ai_poller.yml), so this mesh is the
    # load-bearing trigger and the crons above are the backup.
    #
    # NOTE: "AI Bot Daily Digest" is deliberately NOT a kicker here — the
    # digest is kicked BY this workflow, and a mutual pair would spin.
    workflows:
      - "AI Bot Telegram Poller"
      - "AI Bot Health Check"
      - "AI Bot Weekly Report"
      - "Bot Health Check"
    types: [completed]

permissions:
  contents: write  # pushing continuity files to the ai-bot-state branch

concurrency:
  group: ai-trading-bot
  cancel-in-progress: false  # never kill a wakeup mid-decision

jobs:
  quality:
    # Tests run on every push/dispatch touching the AI bot — never on
    # schedule (the concurrency group would serialize them ahead of trades).
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        # pytest is a dev tool, not in requirements.txt (same pattern as bot.yml)
        run: pip install -r requirements.txt pytest
      - name: AI bot tests
        run: python -m pytest tests/test_ai_agent.py tests/test_ai_live_safety.py tests/test_ai_backtest.py tests/test_heartbeat_guard.py -q

  run-bot:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    # The gate may RELAY (sleep up to 30 min) toward a slot that is about to
    # come due — that is the punctuality mechanism, so wakeups fire at their
    # slot time rather than whenever a trigger happens to land. Everything
    # else is SKIP or a short wakeup run; 360 min is GitHub's hard cap and
    # leaves ample margin.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Network check (Binance + Gemini reachability)
        # Never fails the job — pure diagnostics so a red run's log tells us
        # WHICH endpoint was unreachable (runner egress blips happen).
        run: |
          curl -sS -o /dev/null -w "Binance: HTTP %{http_code} in %{time_total}s\n" --max-time 15 https://api.binance.com/api/v3/ping || echo "Binance: UNREACHABLE"
          curl -sS -o /dev/null -w "Gemini: HTTP %{http_code} in %{time_total}s\n" --max-time 15 https://generativelanguage.googleapis.com/ || echo "Gemini: UNREACHABLE"

      - name: Restore AI bot state from ai-bot-state branch
        # Git branch, not actions/cache: the cache is immutable, best-effort,
        # and skipped when a job fails — a lost cache silently resets the
        # paper account to its starting equity. A branch is always
        # restorable and inspectable.
        run: |
          mkdir -p data/ai_bot
          if git ls-remote --exit-code --heads origin ai-bot-state >/dev/null 2>&1; then
            git fetch --depth=1 origin ai-bot-state
            git checkout FETCH_HEAD -- data/ai_bot/ \
              && echo "State restored from ai-bot-state branch" \
              || echo "WARNING: ai-bot-state branch has no data/ai_bot yet"
          else
            echo "No ai-bot-state branch yet — first run starts fresh"
          fi

      - name: Schedule gate (slot-based)
        id: gate
        # Runs BEFORE pip setup. Writes run=true|false to $GITHUB_OUTPUT:
        #   slot due & unserved -> true  (on-time wakeup or catch-up)
        #   slot served, next far -> false (redundant kick, no wakeup)
        #   slot served, next near -> sleeps to it, then re-decides
        # This is what holds the bot to its 6 scheduled decisions/day even
        # though the hardware heartbeat fires every ~20 minutes.
        run: python scripts/ai_bot_gate.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run one AI wakeup
        # Only when the gate says a slot is actually due. A skipped firing
        # must never reach the AI or the exchange.
        if: steps.gate.outputs.run == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
          # AI_ prefix: the main bot's workflows use TELEGRAM_* secrets for a
          # different token — repo secrets are shared across ALL workflows, so
          # reusing the name would hijack the main bot's alerts.
          TELEGRAM_BOT_TOKEN: ${{ secrets.AI_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.AI_TELEGRAM_CHAT_ID }}
        run: python -u scripts/start_ai_bot.py once

      - name: Answer Telegram commands (/status /positions /last)
        # ALWAYS, unconditionally: the /status round-trip proof of
        # 2026-09-13 showed a gate-skipped run is exactly when a texted
        # command can go unanswered for hours (the poller long-poll was
        # dead). The responder consumes pending updates so nothing is
        # ever left dangling; it must never block state persistence, so
        # the persist step below still runs with always() even if this
        # step exits nonzero.
        if: always()
        env:
          AI_TELEGRAM_BOT_TOKEN: ${{ secrets.AI_TELEGRAM_BOT_TOKEN }}
          AI_TELEGRAM_CHAT_ID: ${{ secrets.AI_TELEGRAM_CHAT_ID }}
        run: python -u scripts/ai_telegram_commands.py

      - name: Persist state to ai-bot-state branch
        # ALWAYS runs — even when the wakeup failed — because the journal
        # entry for a failure is exactly what the next wakeup's handoff
        # needs. Losing it would erase the audit trail.
        if: always()
        env:
          STATE_BRANCH: ai-bot-state
        run: |
          set -e
          FILES="data/ai_bot/strategy.json data/ai_bot/progress.json data/ai_bot/journal.jsonl data/ai_bot/decisions.json data/ai_bot/paper_ledger.json data/ai_bot/trades.jsonl data/ai_bot/telegram_offset.txt"
          HAVE=""
          for f in $FILES; do [ -f "$f" ] && HAVE="$HAVE $f"; done
          if [ -z "$HAVE" ]; then
            echo "No state files produced — nothing to persist"
            exit 0
          fi
          rm -rf /tmp/aibotstate
          if git ls-remote --exit-code --heads origin "$STATE_BRANCH" >/dev/null 2>&1; then
            git fetch --depth=1 origin "$STATE_BRANCH"
            git worktree add /tmp/aibotstate "origin/$STATE_BRANCH"
          else
            git worktree add --orphan /tmp/aibotstate
          fi
          mkdir -p /tmp/aibotstate/data/ai_bot
          for f in $HAVE; do cp "$f" "/tmp/aibotstate/$f"; done
          cd /tmp/aibotstate
          # Add only the files that exist: on a failed wakeup some (e.g.
          # decisions.json) are never written, and `git add` of a missing
          # pathspec kills the persist step (exit 128) — losing the journal
          # entry that the next wakeup's handoff needs.
          HAVE_IN_TMP=""
          for f in $FILES; do [ -f "$f" ] && HAVE_IN_TMP="$HAVE_IN_TMP $f"; done
          if [ -z "$HAVE_IN_TMP" ]; then
            echo "Nothing persisted — no state files present"
            exit 0
          fi
          git add $HAVE_IN_TMP
          if git diff --cached --quiet; then
            echo "State unchanged since last persist"
            exit 0
          fi
          git -c user.name="ai-bot-state-persister" \
              -c user.email="actions@users.noreply.github.com" \
              commit -m "ai-bot state: run ${{ github.run_number }} (${{ github.event_name }})"
          git push origin "HEAD:$STATE_BRANCH"
          echo "Persisted: $HAVE"

      - name: Upload AI bot logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-bot-state-${{ github.run_number }}
          path: |
            data/ai_bot/journal.jsonl
            data/ai_bot/trades.jsonl
            data/ai_bot/decisions.json
          retention-days: 90
