[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-system"
version = "0.1.0"
description = "Professional-grade trading strategy backtesting and automated trading system"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "ccxt>=4.0",
    "optuna>=3.0",
    "pyyaml>=6.0",
    "pyarrow>=12.0",
    "plotly>=5.15",
    "matplotlib>=3.7",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "psutil>=5.9",
    "requests>=2.28",
    "structlog>=23.0",
    "rich>=13.0",
    "click>=8.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest-xdist>=3.0",
    "pytest-benchmark>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.5",
    "hypothesis>=6.100",
    "typer>=0.12",
]
cs = [
    "pydantic>=2.5",
    "httpx>=0.27",
    "typer>=0.12",
    "hypothesis>=6.100",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.setuptools.packages.find]
include = ["trading_system*"]
